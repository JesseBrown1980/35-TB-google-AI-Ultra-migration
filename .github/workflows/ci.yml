name: ci

on:
  push:
  pull_request:

jobs:
  spine-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # runs the spine self-test, including the no-secret-values scan
      - name: spine self-test
        run: node --test test/spine.test.mjs
      # LEG-4 adapter: STORE-interface parity, sha16 round-trip, never-delete, cloud-path GATED
      - name: google-drive-store adapter
        run: node --test test/google-drive-store.test.mjs
